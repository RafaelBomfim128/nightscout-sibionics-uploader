
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fc">
    <title>Acesso protegido | Status do Serviço</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Arial, sans-serif;
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            color: #1e293b;
            background:
                radial-gradient(circle at 15% 15%, #e4efff 0, transparent 35%),
                radial-gradient(circle at 85% 85%, #e9f0ff 0, transparent 35%),
                #f4f7fc;
        }

        .page {
            min-height: 100vh;
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 36px 32px 28px;
            background: #ffffff;
            border: 1px solid #e8edf5;
            border-radius: 18px;
            box-shadow:
                0 12px 35px rgba(32, 66, 120, 0.07),
                0 2px 8px rgba(32, 66, 120, 0.03);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 58px;
            margin: 0 auto 16px;
            color: #1769e0;
            background: #edf4ff;
            border-radius: 16px;
        }

        .icon svg {
            width: 30px;
            height: 30px;
        }

        h1 {
            margin: 0;
            color: #172b4d;
            font-size: 25px;
            font-weight: 700;
            letter-spacing: -0.6px;
        }

        .subtitle {
            margin: 9px 0 0;
            color: #77849a;
            font-size: 14px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #344256;
            font-size: 14px;
            font-weight: 600;
        }

        input[type="password"] {
            display: block;
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid #d8e0eb;
            border-radius: 9px;
            outline: none;
            background: #ffffff;
            color: #1e293b;
            font-family: inherit;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="password"]::placeholder {
            color: #a0aabd;
        }

        input[type="password"]:focus {
            border-color: #3980e9;
            box-shadow: 0 0 0 3px rgba(57, 128, 233, 0.12);
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 0 23px;
            color: #536176;
            font-size: 14px;
            font-weight: 400;
            cursor: pointer;
        }

        .remember input {
            width: 17px;
            height: 17px;
            margin: 0;
            accent-color: #1769e0;
            cursor: pointer;
        }

        button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 48px;
            padding: 12px 18px;
            border: none;
            border-radius: 9px;
            background: linear-gradient(135deg, #2878e8, #1760cc);
            color: #ffffff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(23, 96, 204, 0.18);
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(23, 96, 204, 0.25);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:focus-visible {
            outline: 3px solid rgba(40, 120, 232, 0.3);
            outline-offset: 3px;
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        #error {
            min-height: 20px;
            margin: 14px 0 0;
            color: #b42332;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
        }

        .footer {
            margin-top: 24px;
            padding-top: 17px;
            border-top: 1px solid #edf0f5;
            color: #9aa5b5;
            font-size: 12px;
            text-align: center;
        }

        /* Em telas baixas, evita centralizar novamente
           o formulário quando o teclado virtual aparece. */
        @media (max-height: 560px) {
            .page {
                align-items: flex-start;
            }

            .container {
                margin-top: 8px;
                margin-bottom: 8px;
            }
        }

        @media (max-width: 420px) {
            .container {
                padding: 30px 24px 23px;
                border-radius: 15px;
            }

            h1 {
                font-size: 23px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>
    <main class="page">
        <section class="container">
            <header class="header">
                <div class="icon" aria-hidden="true">
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11z"/>
                        <path d="m9 12 2 2 4-4"/>
                    </svg>
                </div>

                <h1>Status do Serviço</h1>
                <p class="subtitle">
                    Área de acesso protegido.<br>
                    Informe sua senha para continuar.
                </p>
            </header>

            <form id="login-form">
                <div class="form-group">
                    <label for="password">Senha de acesso</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        autocapitalize="off"
                        spellcheck="false"
                        maxlength="1024"
                        required
                    >
                </div>

                <label class="remember" for="remember">
                    <input
                        id="remember"
                        name="remember"
                        type="checkbox"
                    >
                    Lembrar neste navegador
                </label>

                <button id="submit-button" type="submit">
                    Entrar
                </button>

                <p id="error" role="alert" aria-live="assertive"></p>
            </form>

            <footer class="footer">
                Acesso restrito
            </footer>
        </section>
    </main>

    <script>
        const form = document.getElementById("login-form");
        const passwordInput = document.getElementById("password");
        const rememberInput = document.getElementById("remember");
        const error = document.getElementById("error");
        const submitButton = document.getElementById("submit-button");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (submitButton.disabled) return;

            error.textContent = "";
            submitButton.disabled = true;
            submitButton.textContent = "Verificando...";

            try {
                const response = await fetch("/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        password: passwordInput.value,
                        remember: rememberInput.checked
                    })
                });

                if (response.ok) {
                    window.location.replace("/");
                    return;
                }

                if (response.status === 429) {
                    const retryAfter = Number(response.headers.get("Retry-After"));

                    if (Number.isFinite(retryAfter) && retryAfter > 0) {
                        const minutes = Math.ceil(retryAfter / 60);
                        error.textContent = minutes <= 1
                            ? "Muitas tentativas. Aguarde um minuto antes de tentar novamente."
                            : `Muitas tentativas. Aguarde aproximadamente ${minutes} minutos.`;
                    } else {
                        error.textContent =
                            "Muitas tentativas. Aguarde antes de tentar novamente.";
                    }
                } else {
                    error.textContent = "Senha incorreta. Verifique e tente novamente.";
                }
            } catch {
                error.textContent =
                    "Não foi possível conectar ao servidor. Tente novamente.";
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Entrar";
            }
        });
    </script>
</body>
</html>
